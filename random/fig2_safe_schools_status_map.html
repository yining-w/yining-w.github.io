f foster care placement for children deprived of a family.","lang":"en"}]},{"iso":"BOL","name":"Bolivia (Plurinational State of)","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"BRA","name":"Brazil","status":"On track","pledges":[{"status":"On track","note":"The \"School That Protects\" Program (ProEP/Snave) was established, aiming to promote the continuous training of education professionals, encourage the development of violence prevention and emergency response plans, and support school networks in cases of extreme violence.\nIn terms of expected results, the commitment’s goal is for 38,000 children and adolescents to be directly reached by the methodologies to be disseminated. Additionally, 10,000 schools are expected to adopt the action plans by December 2026. However, at the time of this report's preparation, there is no explicit number of children and adolescents already directly reached by this initiative. The projected investment for ProEP is BRL 24 million.\nThe initiatives are progressing with the implementation of social mobilization campaigns, notably the \"Jump, Play and Care – United for the Protection of Children and Adolescents\" campaign and the National Week to Combat Sexual Violence, aligned with \"Orange May\". Also noteworthy are the Caravans for the Rights of Children and Adolescents, which have already been carried out in 22 Federal Units, ensuring broad social participation.\nIn terms of results, the commitment’s goal is to hold 5 events per year, publish one national guide, and establish 5 hubs by December 2026. Since the mentioned campaigns are carried out nationally in coordination with the states, estimating the outreach becomes more complex. Regarding investments, the necessary documentation is currently being gathered to consolidate and determine the total amount required for full implementation of these actions.","lang":"en"},{"status":"On track","note":"In 2024, the CRIA Program – Prevention and Citizenship was launched, operating across school, family, and community fronts. In addition, the PIPA Program – Preventive Territories was developed in partnership with UNODC, aiming to structure local systems for expanded prevention, with the city of Recife as the first coordinated hub. In the area of professional training, 3,200 individuals were certified.\nThe continuity strategy involves consolidating the CRIA and PIPA programs, conducting new training cycles, and implementing the PRONASCI Youth Project. The central goal is to promote the signing of an Inter-federative Pact, train 5,000 professionals, and implement prevention methodologies in 30 priority municipalities and 5 territories.\nThe direct target audience of this commitment is children and adolescents, who benefit both from the preventive actions and from the capacity building of professionals within their protection network.","lang":"en"}]},{"iso":"BTN","name":"Bhutan","status":"Not started","pledges":[{"status":"Not started","note":"Parent and Caregiver Support: Enhancing parenting skills for children aged 3–5 through ECCD programs, including 50 new centres and 20 Home-Based Interventions from July 2024. MoESD introduced a school-based parenting manual focusing on discipline, emotional support, and child safety. MoH is improving maternal and child health services during the first 1000 days.\nResponse and Support Services: PEMA Centre (60-bed mental health hospital) and a mental health nursing certificate course launched to strengthen services. 8 Outreach Workers and 15 Peer Counsellors deployed for community and hospital-based mental health support. Integrated child services in religious institutions benefit 165 monk children. ECCD professional development includes a diploma program (35 trainees) and NC Level 3 training (48 candidates). Two regional Legal Aid Centres to be established; 67 justice professionals trained on child-sensitive procedures. Anti-bullying guidelines trained 566 education leaders; 1,427 staff trained in social-emotional learning. 149 counsellors and 2,217 students trained in Psychological First Aid and peer support. WCPU established in 20 districts to improve child-friendly police procedures. More than 40 Community-Based Child Protection Teams formed . RENEW expanded Community Service Centres to 13 districts for psychosocial and reintegration support. DPOB’s “Service with Care and Compassion” project supports children with disabilities through healthcare, education, and employment readiness. Disability Equality Training promotes inclusion and strengthens support systems for children with disabilities.\nSafe and Enabling School Environments: Nationwide implementation of the Internal Child Safeguarding Framework; 265 School-Based and 35 Community-Based Committees formed. 730 monk children trained on child protection across 14 monastic institutions. “I Am a Child” multimedia campaign and Child-friendly CRC Concluding Observations developed and disseminated.","lang":"en"}]},{"iso":"BWA","name":"Botswana","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"CAF","name":"Central African Republic","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"CIV","name":"Côte d’Ivoire","status":"On track","pledges":[{"status":"On track","note":"Since the first World Ministerial Conference in Bogotá, Côte d’Ivoire, in light of its commitments to combat violence against children, notes significant progress at the institutional, operational, and data collection levels.\nIndeed, committed to making the school environment a protective space for children, the Ivorian Government prioritized the adoption of regulatory texts aimed at ensuring that no child falls victim to violence at school. Furthermore, safe spaces have been established within schools and in 66 School and University Health Services – Adolescent and Youth Services (SSSU-SAJ). To improve students’ access to social services, social workers have been assigned to the SSSU-SAJ, strengthening the institutionalization of social services within public and private schools. In order to provide care for child victims of violence through a multisectoral approach, the Ministry of National Education and Literacy collaborates with the social services of the Ministry of Women, Family and Children and the Ministry of Employment and Social Protection, through gender-based violence and child protection platforms.\nThe Ivorian Government has paid particular attention to child participation and community engagement. Thus, in coordination with social services, families, and communities, 225 child protection committees have been established in schools across the country. These mechanisms have reached over 73,000 direct beneficiaries, including 15,080 children. The establishment of 414 Child Protection Committees within communities and the organization of 2,646 mass awareness-raising activities and 1,989 community-level awareness sessions have made it possible to reach 369,186 people, including 199,733 women and 169,453 men.\nWith the aim of bringing services closer to communities, six new socio-educational centers have been created, increasing the number from 66 in November 2024 to 72 in September 2025. Five branches of the special police unit responsible for child protection were created to cover the country's 11 police prefectures. In addition, the construction of a socio-educational center for socio-professional reintegration of vulnerable children and adolescents is underway.\nFurthermore, in 2025 the country strengthened the capacities of 200 social workers in mental health following the development of a training guide for social workers and the training of 25 national trainers. To support families, 35 officers from Specialized Education Centers were trained on the “Strong Family” parenting education program, and a pool of 17 trainers for foster families was established.\nThe Ivorian State has strengthened the mechanism for collecting and disseminating data on violence against children through the Child Protection Information System and the Education Management Information System. This has made it possible to have reliable data on types of violence and interventions carried out.","lang":"en"}]},{"iso":"COD","name":"Democratic Republic of the Congo","status":"On track","pledges":[{"status":"On track","note":"-\tAdoption by the Congolese government of the draft National Transitional Justice Policy;\n-\tExperimental establishment of local Truth and Justice Commissions in the province of Kasaï-Central;\n-\tEstablishment of the Steering Committee for the Joint Project for Assistance to Victims of Conflict-Related Sexual Violence and Serious Crimes in the provinces of North and South Kivu, DRC (the project was adopted on August 28, 2025, and will run for twelve months);\n-\tAdministrative compensation by the National Fund for the Reparation of Victims of Conflict-Related Sexual Violence and Crimes Against Peace and the Security of Humanity (FONAREV) for victims who have obtained final judicial decisions;\n-\tEstablishment of two safe spaces, “TOYOKANA,” in the city of Kinshasa (pilot project).M111","lang":"en"}]},{"iso":"COL","name":"Colombia","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"CPV","name":"Cabo Verde","status":"On track","pledges":[{"status":"On track","note":"The Ministry of Education has been strongly investing in the training of educational agents in various cross-cutting areas (e.g. comprehensive sexuality education, prevention of violence and school safety, adolescent pregnancy programs, prevention of alcohol and other drugs, road safety, human rights and citizenship education, climate action, environmental education, menstrual health), peer educators, and the educational community in general, together with national and international partners, notably UNICEF.\n➢ To strengthen the school curriculum, with the transversal inclusion of topics—namely those mentioned above—the Ministry of Education has been updating the Program for the Promotion of Citizenship in Basic and Secondary Education from the Perspective of Thematic Mainstreaming and Comprehensive Education. The purpose of this update is to integrate, within the educational context, the approach to topics and issues in an interconnected manner, crossing disciplinary and sectoral boundaries. Instead of working on each area separately, transversality seeks to establish connections and promote joint actions to deal with complex issues such as citizenship and human rights, ethics, the environment, health, and others.\n➢ Through a partnership between civil society (NGO ACRIDES) and several institutions, a comic book entitled Send Me a Photo was developed with the aim of alerting children, adolescents, and young people about the inappropriate use of the internet and the risks that can make them vulnerable and more susceptible to exploitation, abuse, harassment, bullying, as well as other threats that affect their well-being, such as depression and anxiety. More than 1,500 guides were distributed nationwide, with a particular focus on schools.\n➢ The National Commission for Human Rights and Citizenship, in partnership with the Ministry of Education, developed the Human Rights for Children Aged 5 to 10 project, aiming to train teachers and educators, as well as to create material resources (booklets, manuals, activity notebooks, educational games, and videos in sign language) for teaching and learning Human Rights within the formal education system.\nDevelopment of materials for an inclusive approach to Comprehensive Sexuality Education:\n➢ Training of municipal coordinators of pre-school education and teachers of basic education (Sotavento and Barlavento regions);\n➢ Editing/printing and distribution of the Sex Education Guide and the brochure “Protect Yourself” for pre-school and basic education;\n➢ Training on Sexuality Education for pre-school education professionals and basic education teachers;\n➢ Replication of Sexuality Education training by municipal coordinators to pre-school education professionals;\n➢ Field supervision and monitoring visits (kindergartens and 1st cycle basic education schools) for implementation of training and use of materials.\nInclusive Education Actions:\n➢ Implementation of the National System for Reporting Children and Young People with Special Educational Needs (SEN), starting from the 2018/2019 school year;\n➢ Creation of 23 Multidisciplinary Support Teams for Inclusive Education (EMAEI) across all municipalities;\n➢ Regulation of the Multidisciplinary Support Teams for Inclusive Education;\n➢ Strengthening of the technical skills of inclusive education professionals and teachers through various training activities in special/inclusive education areas;\n➢ Improvement of working conditions for the 23 EMAEIs through the acquisition of IT equipment, teaching material kits, educational games, and specific materials for special education;\n➢ Publication of Decree-Laws No. 29 and No. 30 of July 12, 2022, on the National System for the Assessment of Learning in Basic and Secondary Education, which include the evaluation of students with special educational needs;\n➢ Introduction of the Special Educational Needs Module in the Integrated School Management System (SIGE);\n➢ Publication of Decree-Law No. 9/2024 of February 29 – establishing the principles and norms that ensure the inclusion of children and young people with SEN in the education system;\n➢ Signing of the project “School for All – Phase III, National System for Reporting Children and Young People with SEN” with the Brazilian Cooperation Agency (ABC) in 2023, and the start of its implementation with the Federal University of Santa Maria (UFSM) in March 2024. This initiative will strengthen the technical capacities of around 200 educational agents (professionals from the multidisciplinary support teams for inclusive education, teachers, pedagogical deputy directors, and assistant directors).","lang":"en"}]},{"iso":"CRI","name":"Costa Rica","status":"On track","pledges":[{"status":"On track","note":"Costa Rica implements the development and consolidation of an educational system that allows the entire population access to quality education, focused on the comprehensive development of individuals. Among the specific actions carried out are the following:\n1.                  Peace Education and Coexistence Study Program: This program seeks to create safe environments, free of violence.\n2.                  Comprehensive Educational Security and Risk Management Plan (SEGURED): An automated digital tool that constitutes the first national map of educational security.\n3.                  Inter-institutional and Intersectoral Cooperation for the promotion of safe environments and leadership development, highlighted by:\no        Student Community Service (SCE): Alliances with public and private institutions and stakeholders to develop projects that contribute to violence prevention, educational inclusion, mental health, sports, arts, and coexistence.\no        \"Let's Raise Our Voice\" Initiative (Alcemos la voz): Focused on the prevention and reporting of sexual harassment and the safe use of digital technologies, through induction, awareness-raising, and support processes for educational centers.\no        Student Government Program: Aims to strengthen democratic participation, accountability, and informed decision-making.\no        \"Safe Route to School\" Program (Camino Seguro a la Escuela): Coordinates actions with communities and public institutions to promote safe, accessible, and inclusive routes to and from educational centers.\no        \"Living Together\" Program (Convivir): Allows for the sharing of successful initiatives for violence and bullying prevention, and the promotion of a culture of peace.\no        Student Arts Festival (FEA): This serves as a platform that promotes expression, inclusion, and coexistence through art.\no        The inter-ministerial \"Song for Peace\" Project (Canción por la Paz): Encourages the participation of young people between 12 and 21 years old, promoting values such as non-violence, positive leadership, and peaceful conflict resolution.","lang":"en"}]},{"iso":"CUB","name":"Cuba","status":"On track","pledges":[{"status":"On track","note":"The new Code on Childhood, Adolescence, and Youth clearly establishes the prohibition of the use of any form of violence in the educational process and reaffirms the duty of the national education system to promote dignity, respect, and the active participation of students.\nThe Ministry of Education is currently working on updating the Protocol for the Prevention of and Response to Violence in Schools. Likewise, the Ministry is in the process of drafting a new Education Law, which will also include specific provisions for the prevention of and response to violence in educational settings, thereby strengthening the national regulatory framework.\nDuring the 2024–2025 school year, training and awareness-raising activities were conducted for educators and school administrators, aimed at promoting education in human rights, respectful parenting, and specialized child protection mechanisms. These training initiatives reached more than 200,000 educators, strengthening their capacity to effectively address manifestations of violence within the educational environment.\nThe regulatory framework and institutional capacities have been strengthened to ensure safe and violence-free school environments, and these advances will continue to be deepened in the coming years. As a result, it is expected that girls, boys, and adolescents will enjoy increasingly protective educational spaces where they can learn and develop to their fullest potential.","lang":"en"}]},{"iso":"DMA","name":"Dominica","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"DOM","name":"Dominican Republic","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"EST","name":"Estonia","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"GAB","name":"Gabon","status":"On track","pledges":[{"status":"On track","note":"1. Actions toward achieving the 2024 Bogotá Commitments\n•\tEstablishment of the Ministry of Women, Family, and Child Protection.\n•\tAwareness-raising among families, community and opinion leaders on responsible parenting, children’s rights, and positive cultural values in Oyem — about 650 participants took part in this activity under the leadership of religious figures, civil society representatives, and the Public Prosecutor.\n•\tParticipation in regional strategic meetings on combating child trafficking and revising the African Union regional legal framework on the protection of women and children.\n•\tDissemination of the National Guide for the Care of Victims/Survivors of Sexual Violence and the multisectoral care pathway.\n•\tAwareness caravan for students, teachers, and school supervisors in five secondary schools in Tchibanga — 500 students and 20 supervisors were reached with messages about forms of violence and response procedures.\n•\tInvolvement of the First Lady and the UN Special Representative of the Secretary-General on Violence Against Children (SRSG-VAC) in a joint advocacy initiative that enabled the country to join the Global Pathfinding Alliance to End Violence Against Children.\n•\tAwareness-raising among community leaders, the general public—especially women—on women’s and girls’ rights, violence, human trafficking, and other related issues. 800 participants, including 7 government members, civil society representatives, and 2 magistrates, took part during the National Women’s Day celebration.\n•\tDecember 2024: Strengthening the judicial response — 300 officers from Specialized Police Units trained in 52 municipalities across the country to improve the reception and handling of child victims and/or perpetrators of violence through a child-friendly approach under the concept “Child-Friendly Police.”\n•\tResponsible parenting education delivered through 20 daycare centers and one community center, reaching 2,500 parents sensitized on abandoning violent and neglectful practices toward children.\n•\tTraining of 80 social workers at community and school levels to support child survivors of violence and their families in resilience processes, mental health management, and behavior change (July 2025).\n•\tSupport to the Directorate-General for Consular Affairs and the Migration Taskforce to strengthen protection mechanisms for migrant and trafficked children from West Africa to Gabon (July 2025).\n•\tDecember 2025: Collection of administrative data to update the national indicator matrix on child rights violations for the period 2021–2023.\n•\tPartnership between Airtel Gabon and UNICEF for the reactivation of the toll-free number 1412, used for reporting and referring survivors of violence.\n•\tSupport from INTERPOL and UNODC for organizing a regional meeting of justice and security officials on combating child trafficking in the subregion (August 2025).\n•\tCollaboration with the Ma Bannière Foundation under the ACTI’JEUNE initiative, aimed at raising awareness among youth under 18 about violence and promoting their civic participation.\n•\tFinancial support from the ARISE Group to strengthen the Reception Center for Children in Social Difficulty (CAPDES) (June 2025).\nImpacts\n•\tPrioritization of trials and convictions for sexual violence offenders, representing 3 out of 5 of the crimes adjudicated by the criminal courts of Mouila, Franceville, and Port-Gentil during the first and second quarters of 2025.\n•\tJanuary 2025: Participation of social workers in criminal court sessions involving children in conflict with the law.\n•\tAcceleration of the implementation of non-custodial measures for children in conflict with the law in juvenile courts.\nChallenges\n•\tShortage of clinical psychologists, psychiatrists, and mental health experts to support survivors within families and to follow up with offenders in prisons to prevent recidivism.\n•\tLack of disaggregated data for monitoring violence indicators by province and high-incidence areas.\n•\tLimited financial resources for implementation of the commitments.\n•\tNeed for greater technical and financial partnerships to support future actions.\nOutlook\n•\tInclusion in the 2026 Finance Bill of funding for the construction of three reception and accommodation centers for vulnerable children.\n•\tStrengthened awareness campaigns in schools and communities.\n•\tOpening of a child detention center in Port-Gentil.\nFunding sources for these activities\n•\tState budget, fiscal year 2025\n•\tUNICEF, IOM, and UNODC\n•\tPrivate sector (ARISE Group, ASSALA, AIRTEL Gabon)","lang":"en"}]},{"iso":"GBR","name":"United Kingdom","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"GHA","name":"Ghana","status":"On track","pledges":[{"status":"On track","note":"Capacity building programmes were regularly held for teachers to enhance their knowledge and skills on the Safe School programme. The number of teachers benefited from this intervention is being analysed.\nGhana Immigration Service and the Ministry of Gender, Children and Social Protection identified 1,332 children living in the streets and provided them with referrals and child-friendly services.","lang":"en"}]},{"iso":"GIN","name":"Guinea","status":"Just started","pledges":[{"status":"Just started","note":"In the context of the implementation of the Bogotá commitments, the Republic of Guinea has made some progress:\n• The new Constitution of the Republic of Guinea, which was voted on 21 September 2025, includes, in its article 26, a specific reference \"to the protection of children and young people against exploitation, abandonment, delinquency, sexual abuse, ill-treatment, trafficking, rural exodus and irregular migration\". Article 21 of the same Constitution guarantees free education, compulsory access for children at the age of five (5) years and their retention in school until the age of 17.\n• In conjunction with advocacy with the Ministry of Education, the school rules of procedure and the teachers' code of conduct prohibit corporal punishment in schools.\n• As part of the revision of student training, lessons are dedicated to the fight against violence, thus strengthening the implementation of the commitment.\n• The Ministry for the Promotion of Women, Children and Vulnerable Persons (MPFEPV) has developed a national child protection policy (2025-2035), which has already been technically validated, with the elimination of violence as a central priority. The budgeted action plan is currently being developed.\n• The MPFEPV, with the support of UNICEF and WHO partners, is finalizing the development of a national roadmap for the implementation of the INSPIRE strategies to strengthen efforts to eliminate violence against children. This roadmap will focus on key strategic activities to advance the agenda and mobilise domestic financing.\n• Since 2024, the Ministry for the Promotion of Women, Children and Vulnerable Persons has set a target in its budget to decentralize 20% of resources to local administrations, which contribute to the fight against violence against children.\nWith support from UNICEF:\n• A national strategy for early childhood development (ECD) is also being developed, with positive parenting recognized as a central pillar.\n• A budget note on child\nThe bottlenecks that prevented the start of the implementation of the commitment made in 2024:\n• Unavailability of public resources to start the implementation of the commitment.\nWhat are the prospects/next steps for the concrete implementation of the commitment made on the ground?  In what period (beginning and end):\n• January – March 2026: identification of 100 schools, including 70 primary and 30 secondary schools in Conakry and the seven administrative regions, taking into account the level of violence recorded in these schools;\n• April - September 2026: development and validation of the training module on violence and training of 1300 teachers on the prevention of violence against children;\n• October-December 2026: establishment of safe, accessible and confidential reporting channels within schools and information/awareness of 2000 students on their use as well as on the consequences of violence\n• The Government of Guinea is in the process of transitioning from an annual budget to a multi-year budget focused on key programmes with specific indicators, including violence against children.\nWhat are the supports/expectations of the global partnership:\nTechnical and financial support for the implementation of the roadmap to combat violence against children, taking into account activities dedicated to schools and teaching staff.","lang":"en"}]},{"iso":"GMB","name":"Gambia","status":"On track","pledges":[{"status":"On track","note":"The Gambia has advanced its pledge to eliminate corporal punishment in schools through the adoption of a national roadmap jointly developed with UNICEF, and key child protection stakeholders. Implementation is underway, with legislative reforms initiated by the Ministry of Gender, Children and Social Welfare through the Ministry of Justice to repeal Children’s Act 2005 and revise Cap 46 of the Education Act, ensuring explicit provisions against corporal punishment.\nA consultant is leading this process in consultation with the National Child Protection Steering Committee. In parallel, a baseline study on the prevalence, causes, and impacts of corporal punishment is planned, with completion expected by December 2025.","lang":"en"}]},{"iso":"GNB","name":"Guinea-Bissau","status":"On track","pledges":[{"status":"On track","note":"The State of Guinea-Bissau commits to enhancing the prevention of violence against children in schools, including gender-based violence and bullying by strengthening the response capacity of State services and reinforcing prevention initiatives in schools.\nThis will be achieved through coordinated efforts between the Ministry of National Education and the Ministry of Women, Family, and Social Solidarity (Institute for Women and Children). By December 2030, the initiative aims to reach 75% of high schools and basic education institutions nationwide.\nAs lessons learned to accelerate implementation or increase the scope of the commitment, we began to strengthen and improve our coordination with civil society organizations and communities in areas considered to have a high prevalence of violence, such as the regions of Oio, Quinara, and Biombo.","lang":"en"}]},{"iso":"GTM","name":"Guatemala","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"JAM","name":"Jamaica","status":"On track","pledges":[{"status":"On track","note":"\tSafe School Certification Programme (Ministry of Education, Skills, Youth and Information) – This was piloted in 2024 with 120 schools; of this number, 71 schools were accredited as safe and secure learning environments. This programme supports the MOESYI’s Inter-Ministerial School Support Strategy by strengthening protective factors to reduce violence levels in schools.\n\tViolence Prevention Partnership Programme (Ministry of Education, Skills, Youth and Information) – A programme developed through collaboration between the United Kingdom and Jamaica. The programme seeks to develop and deliver more effective responses to address the underlying risk factors that promote excessive violence levels.\no\tExpected Outcome – To enable Jamaica to increasingly combat the drivers of violence in selected communities through improved data architecture, effective and coordinated delivery, and civil society engagement.\no\tFunding and Duration - £15.0 Million over 6 years, which took effect October 2024\n\tNational Restorative Justice Programme (Ministry of Justice) – Between November 2024 and June 2025, 56 schools received Preventative Restorative Practice Training; 1,611 children were trained in preventative Restorative Practices. Further, 197 conferences were held with children; 451 children benefitted from the conferences.\n\tIncrease in Child Friendly Spaces (Child Protection and Family Services Agency (CPFSA)) – Jamaica, through the CPFSA, has\nreaffirmed its commitment to ensuring that children, no matter where they are, can access care in environments designed with their safety and well-being at the centre. This reaffirmation was recently highlighted through the creation of child appropriate environments for children experiencing traumatic situations with the opening of two new Child-Friendly Spaces at its parish offices in St. Ann and St. James. Child-friendly spaces (CFSs) are specially designed rooms that provide children in crisis situations with a safe, nurturing, and stimulating environment. These spaces allow children to cope with stress, play, learn, and connect with peers and support services, while also offering psychosocial support, recreation, and provide vital links to care and protection services. By restoring a sense of normalcy, these spaces help to strengthen children’s resilience and overall well-being.\n\tNational Child Diversion Programme (Ministry of Justice) - between November 2024 and June 2025, 493 school-aged children were referred for interventions; treatment plans for 274 (166 males and 108 females) were developed in the programme for the said period. Some of the services provided for children (12 – 17 years) in conflict with the law include:\no\tMentorship\no\tEducation and Training\no\tCounselling (Individual and Family)\no\tDrug Screening, Education and Treatment\no\tConflict Management\no\tSexual and Reproductive Health Education and Counselling\n9,400 children were reached through sensitization sessions on Child Diversion for the said period.\n\tParenting Support – Jamaica, through the National Parenting Support Commission and other agencies continuously offers parenting programmes and initiatives to enhance effective parenting nationally. Parents are, inter alia, equipped with knowledge and skills to improve parenting strategies to ensure they act in the best interest of the nation’s children.","lang":"en"}]},{"iso":"JOR","name":"Jordan","status":"On track","pledges":[{"status":"On track","note":"Jordan has made measurable progress toward its pledge to expand child-friendly interview rooms and install CCTV systems. In 2025, UNICEF supported the Public Security Directorate / Family Protection and Juvenile Department (FPJD) in creating safer environments for victims and witnesses of violence. New interview rooms were established in North Amman, Ajloun, and in Azraq and Zaatari Camps, providing private, non-intimidating spaces for survivors and children in contact with the law. These facilities promote well-being, encourage reporting, and strengthen access to justice.\nIn parallel, UNICEF trained 140 FPJD staff, including police officers, social workers, and psychologists, on child-sensitive procedures. This training ensures interviews are conducted in trauma-informed, rights-based ways, enabling professionals to respond effectively to the needs of vulnerable children and women.\nThe NCFA’s National Committee for Juvenile Justice, with UNICEF’s support, began developing a case management pathway for juvenile offenders, grounded in individualized assessments and coordinated interventions. This consultative process engages judicial, security, health, education, and social institutions to reinforce restorative justice and rehabilitation.\nAdditionally, NCFA equipped facilities linking FPJD with the Grand Criminal Court, while the Ministry of Social Development and the Ministry of Justice established five electronic rooms for remote trials. Building on these achievements, both ministries are preparing an agreement to expand CCTV to care homes and shelters, further strengthening protection and survivor-centered justice.","lang":"en"}]},{"iso":"JPN","name":"Japan","status":"On track","pledges":[{"status":"On track","note":"For the enforcement of the Prevention of Sexual Violence against Children Act scheduled in December 2026, various preparations are underway, including development of subordinate legislations, formulation of guidelines and manuals, and raising awareness and understanding of the new system among the general public and relevant stakeholders.","lang":"en"}]},{"iso":"KEN","name":"Kenya","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"KGZ","name":"Kyrgyzstan","status":"Just started","pledges":[{"status":"Just started","note":"More than 2,000 social pedagogues and class teachers were trained on positive discipline. However, it was noticed that all schools are using different approaches and there is no standard approach endorsed by ministry of Education. A focal person at the MOE is conducting an inventory analysis of all existing programmes on positive discipline and violence in schools. The MOE will then speak to Minsitry of Social Welfare to coordinate as they are undertaking a similar exercise on positive parenting which would have overlaps. The approved materials will be transferred to the Republican Institute for advanced training and to regional methodological centers, where they will be used to support the ongoing professional development of teachers.\nAs part of the national reform of the education sector “Altyn Kazik”, state standards have been revised and curriculum standards are now starting to be revised. If VAC related issues can be integrated to relevant subjects this would apply to all levels of education and cover more than 1,4 million children across the country.\nA “School without Violence program” was originally developed by the Ombudsman office in 2016, piloted in 30 schools, evaluated and then handed over to the Ministry of Education. It is currently being reviewed by the Ministry of Education to update its content in response to emerging issues such as online violence, cyberbullying and mental health challenges. It also needs to include mechanisms to prevent and respond to violence against children in schools.\nAt the end of 2024, a new mechanism for the prevention of and response to violence against children in schools was established. Preventive councils were set up in all educational institutions, consisting of representatives from the juvenile police, social workers social pedagogues, teachers and school administration, when necessary, local self-government bodies. These councils hold monthly meetings to address child-related issues and may convene more.","lang":"en"}]},{"iso":"LBR","name":"Liberia","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"LKA","name":"Sri Lanka","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"LSO","name":"Lesotho","status":"On track","pledges":[{"status":"On track","note":"Lesotho continues to make meaningful strides in creating safe, inclusive, and child-friendly learning environments. As part of this effort, Child Helpline messaging has been developed and rolled out across schools nationwide, ensuring that children are aware of where and how to seek help when facing abuse, neglect, or distress. This initiative empowers children with knowledge and access to support, reinforcing their right to protection.\nTo further strengthen the child protection response, Sesotho-language referral pathways have been produced and widely disseminated through posters placed in schools, village chiefs’ offices, community councils, health clinics, civil society organizations, and government facilities. This localized approach ensures that communities are equipped with clear, culturally relevant guidance on how to respond to child protection concerns.\nThe impact of these efforts is evident: the national Child Helpline has received increased   calls, marking a significant increase compared to 2023.  These figures highlight both the growing awareness among children and communities, and the urgent need to sustain and expand outreach and education campaigns to prevent and respond to violence.\nRecognizing the pivotal role of educators in safeguarding children, the Government of Lesotho,  is implementing targeted training for teachers and school staff in 300 hard-to-reach schools, covering 52,695 pupils. This capacity-building initiative focuses on child protection principles, identification of abuse, and effective use of referral pathways. By equipping school personnel with the skills and tools to respond appropriately, Lesotho is reinforcing schools as safe spaces where children are protected, supported, and empowered to thrive.","lang":"en"}]},{"iso":"MNE","name":"Montenegro","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"NAM","name":"Namibia","status":"On track","pledges":[{"status":"On track","note":"Training on the NSSF is ongoing in schools.  Integrated School Health and Safety Programmes are ongoing across schools and regions.\nSS4D launched in Kavango East region; Training of Trainers for Sports officers and Regional School Counsellors done to extend the roll out to more schools.  Implementation in other regions is ongoin.\nPlanning is underway to undertake the safe to learn diagnostic tool.","lang":"en"}]},{"iso":"NGA","name":"Nigeria","status":"On track","pledges":[{"status":"On track","note":"In line with the Federal Government’s commitment to the Bogota Pledge, this year’s National Children’s Day had the theme: “Stand Up, Speak Up: Building a Bully-free Generation. The President’s Children’s Day address on May 27, 2025,  on the theme reached more than 37.3 million children, teachers, and community members across the 36 states and the Federal Capital Territory.\nNational Youth Conference is planned to provide an opportunity for participation and a voice for young people in determining the nature of education and life skills relevant to them.","lang":"en"}]},{"iso":"PRY","name":"Paraguay","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"RWA","name":"Rwanda","status":"On track","pledges":[{"status":"On track","note":"Safeguarding\n(1) Together with partners, the National Child Safeguarding Framework was developed and is now under finalization.\n(2) A pilot program on child protection and safeguarding in schools is implemented in 5 districts","lang":"en"}]},{"iso":"SEN","name":"Senegal","status":"Just started","pledges":[{"status":"Just started","note":"The curriculum reform process has indeed begun, but the resources needed to support this commitment have not yet been mobilized.","lang":"en"}]},{"iso":"SLE","name":"Sierra Leone","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"SLV","name":"El Salvador","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"SOM","name":"Somalia","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"SRB","name":"Serbia","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"STP","name":"Sao Tome and Principe","status":"On track","pledges":[{"status":"On track","note":"Regarding the second axis, the following should be highlighted:\n1.\tOne of the most significant advances in the child protection system has been the creation and strengthening of protection networks at the district level. This initiative seeks to decentralize protection actions, allowing cases to be addressed more quickly and in a coordinated manner within the communities themselves. These networks function as coordination platforms that bring together local authorities, social services, civil society organizations and community leaders, ensuring an integrated and effective response to protect children's rights.\n2.\tThe country has been actively working to incorporate themes related to child protection and children's rights into the education system, especially with regard to violence. Although a specific “school curriculum” has not yet been formally implemented, continuous and collaborative efforts are underway, including curriculum review and the development of manuals and guidelines to address violence — particularly sexual violence — in schools. Key actions and initiatives include:\nCurriculum review: The country carried out a review of the school curriculum to incorporate topics on sexual and reproductive health. This initiative aims to empower young people to protect their health and themselves.\nCodes of conduct: A new code of conduct for public school employees was launched to create a safer environment and protect students against exploitation and harassment.\nPartnerships and manuals: With support from organizations such as UNICEF, the country launched a “manual of flows and guidelines for the protection of children and adolescents victims of violence.” This document serves as a tool for professionals from various sectors (education, justice, health, etc.) to act in a coordinated manner.\n3.\tThe country’s commitment to the full protection of children and adolescents has been reinforced by the establishment of specific support structures. In the health sector, a specialized hospital space was created to provide an immediate and coordinated response, offering medical and psychological care in one location. In the justice system, a specialized courtroom was created for the hearing of children and adolescents who are victims of violence. This environment is equipped to ensure “testimony without harm,” following international protocols that safeguard the well-being of the victim throughout the judicial process.\n4.\tA significant step in the country's commitment to justice and child protection was the revision of criminal legislation. A draft law has been developed to incorporate legal innovations, such as the possibility of obtaining statements from children for future memory, ensuring that their testimonies are preserved without the need for repeated questioning. This revision also strengthens other mechanisms for the protection of children's rights in the criminal justice system. The document is currently in its final approval stage and will subsequently be promulgated, culminating in the entry into force of these important legal instruments.\n5.\tThe implementation of the specialized room for hearing children is a significant advance, but its effectiveness depends on a robust support system. In this sense, the country has been working toward full operationalization through the development of specific legal mechanisms. These mechanisms are essential to define operational protocols and ensure that children's testimony is used appropriately in judicial proceedings, minimizing the risk of revictimization.\nAlongside these institutional and legal advances, the country recognizes the need to strengthen the monitoring and evaluation system, which currently lacks robust indicators and standardized data collection mechanisms. To ensure the effectiveness and sustainability of actions, the progressive allocation of national resources and diversification of funding sources are underway, reducing external dependence.\nChild participation remains incipient, and formal mechanisms for active listening and public consultation are being developed to ensure that children and adolescents can contribute to the formulation, monitoring and evaluation of policies that concern them.\nIn the area of inclusion and protection of the most vulnerable groups, measures targeting children with disabilities and children in street situations stand out, including accessibility initiatives, support to shelters and family reintegration programs, in collaboration with civil society organizations. These initiatives reinforce the national commitment to leaving no child behind.","lang":"en"}]},{"iso":"SWZ","name":"Eswatini","status":"On track","pledges":[{"status":"On track","note":"Eswatini has prioritized the integration of violence prevention and child empowerment within the formal education system. Through the Ministry of Education and Training, particularly the Guidance, Testing, and Counselling Unit, Positive Discipline sessions have been conducted as part of staff development programmes in 143 schools nationwide. These sessions aim to equip educators with non-violent, child-centered approaches to classroom management, fostering safer and more nurturing learning environments. By promoting empathy, respect, and constructive communication, the initiative is helping to shift entrenched disciplinary norms and build a culture of care within schools. In addition to empowering teachers, Eswatini has invested in strengthening the capacity of volunteers working in schools. In-depth training on child protection guidelines has been provided to Peace Corps volunteers deployed across the country. These trainings ensure that volunteers are well-versed in safeguarding principles, psychosocial support, and referral mechanisms, enabling them to contribute meaningfully to the well-being of learners. The collaboration between the Ministry and development partners reflects a shared commitment to holistic education one that not only imparts knowledge but also protects and uplifts children.","lang":"en"}]},{"iso":"TCD","name":"Chad","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"TLS","name":"Timor-Leste","status":"On track","pledges":[{"status":"On track","note":"Curriculum Development: There is an undergoing elaboration of a new curriculum for cycle 3 of basic education (typically the final years of basic/primary school). This new curriculum specifically focuses on human fraternity, suggesting an emphasis on social cohesion, peace, and mutual respect in the educational content. It will benefit approximately 44,924 students in cycle 3.","lang":"en"}]},{"iso":"TTO","name":"Trinidad and Tobago","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"TUR","name":"Türkiye","status":"On track","pledges":[{"status":"On track","note":"a. Short-term Actions\nStandardising Training Modules and Awareness-Raising Tools\nStandardised training modules and awareness tools are being developed for caregivers, parents, and professionals on preventing neglect, abuse, exploitation, and violence.\nUnder the Strengthening Decision Support Mechanisms in Child Protection Services project (MoFSS–UNICEF), the Guide to the Assessment Framework for Professionals Working in Child Protection was prepared. Training of 140 ministry staff as trainers has been completed, and sessions for social workers in all 81 provinces are ongoing; 2,341 professionals have been trained since 2024.\nThe Ministry of Health provided awareness training to 93,259 healthcare personnel and 57,715 staff from other institutions in 2024 on identifying and preventing child neglect and abuse.\nThe Awareness-Raising Training Programme on Developing and Strengthening Children’s Life Skills, supported by UNICEF, trains parents and caregivers of children aged 0–6 on Parenting, Prevention of Neglect and Abuse, Responsive Care, Positive Discipline, Digital Parenting, and Interactive Play and Reading.\nThe Emotional Skills for Early Adolescence (EASE) program, developed by WHO and UNICEF, aims to enhance emotional coping skills among children and caregivers. A pilot implementation will target 20 child–parent pairs receiving Social and Economic Support (SED) services.\nUnder the Family Education Program (AEP), 679,000 people have been trained on 210 topics in education, health, law, economics, and media, while 243,000 have participated in the Pre-Marriage Education Program.\nThe “Velivizyon” platform, launched by MoNE, provides parents with online guidance and awareness content.\nSpecialised Children’s Homes provide temporary care and psychosocial support for children drawn into or victimized by crime, including those with substance abuse histories or unaccompanied minors.\nThe Anka Child Support Program, now in its 3.0 version, offers individual and family counselling, crisis intervention, and modules on digital and substance addiction, technology literacy, and family addiction. It will cover all institutionalised children aged 11–18.\nImproving Preventive Actions\nChild safeguarding measures are implemented in locations that could endanger children’s safety, such as abandoned buildings or areas frequently visited by children and youth.\nChildren Are Safe Teams, established in all 81 provinces, conduct identification, referral, and monitoring activities for children at risk.\nA directive defines their working procedures and service standards.\nThese teams focus on children affected by neglect, abuse, delinquency, or street work, as well as those reintegrated into families after protection orders. Regular home visits assess risks and ensure referrals to necessary services.\nUnder the Education and Security Project (MoFSS, MoI, MoNE, and Union of Municipalities), preventive strategies and joint practices—such as Turkey Peace and Trust, School Circles Inspections, and Prevention of Cigarette Sales Near Schools—are implemented.\nThe teams also collaborate with schools to identify children at risk through absenteeism and other indicators and provide family guidance and information on MoFSS services and the ALO 183 Social Support Line.\nAs of 2025, Children Are Safe Teams have provided interventions for 58,726 of the 64,703 children identified as at risk.\nUNICEF supports the teams’ fieldwork, and three additional capacity-building training programs are planned for late 2025.\nSupporting Schools to Promote Mental Health and Psychosocial Well-Being\nSchools are supported to promote students’ mental health and psychosocial well-being by enhancing teachers’ capacity in school counselling and establishing mechanisms for identifying and reporting at-risk students.\nThe Addiction Prevention Training Program of Türkiye continues to inform students, parents, and teachers about technology addiction.\nThe Peer Bullying Awareness Program provides educational materials and guidance activities for teachers, students, and parents on cyberbullying and safe internet use.\nProjects include:\n-\tDeveloping Teachers’ Well-Being and Capacity Building Against Peer Bullying\n-\tIncreasing School Enrollment and Attendance, especially for girls\n-\tStrengthening Education and Access in Secondary Schools\nMoFSS participates in the Education Participation and Absenteeism Monitoring Project (with UNICEF and MoNE) to track and reintegrate students at risk of dropping out.\nThe Inter-Institutional Social Service Intervention Project for Children Excluded from Education, supported by the UK Fund, monitors secondary students aged 14–17 at risk of absenteeism or dropout.\nThe Classroom-Based Intervention (CBI) program supports students’ resilience and recovery after traumatic events.\nThe School-Based Substance Abuse Intervention Program strengthens guidance counsellors’ skills to provide preventive support.\nb. Medium- to Long-Term Actions\nDeveloping and Strengthening Data Systems on Violence Against Children\nThe Turkish Statistical Institute launched the International Classification of Violence Against Children (ICVAC-V1.0) and accompanying dictionary on November 27, 2024.\nThe Ministry of Family and Social Services, with UNICEF support, completed a Child Research Study and is planning a Peer Bullying Study.\nQuality of child care services is monitored through the Minimum Standards and Self-Assessment System, comprising 28 standards across five domains: professional practice, personal care, personnel, resources, and management.\nEighteen quality assessment areas track compliance with these standards, focusing on informed participation, child safety, staff capacity, reporting obligations, and safe environments.\nThe Child Protection and Care Standards ensure:\n-\tChild rights and best interests in all decisions\n-\tProtection of privacy and confidentiality\n-\tFamily-based care and participation\n-\tClear communication, data recording, and continuous quality improvement\n-\tSystem Strengthening, Workforce, and Accountability Frameworks\nThe Children Are Safe Teams play a central role in screening, identifying, and monitoring at-risk children nationwide. Their work includes field assessments, home visits, and referrals to appropriate services.\nUNICEF supports their expansion and professional development through ongoing training and standardization of methods.\nThese efforts aim to strengthen the national child protection system, set quality standards, and ensure accountability and coordination across sectors.","lang":"en"}]},{"iso":"TZA","name":"United Republic of Tanzania","status":"On track","pledges":[{"status":"On track","note":"A total of 5,900 primary school teachers and 3,982 secondary school teachers were trained in establishing child protection desks in schools.\nTrainings conducted resulted in the establishment of 6,675 active child protection desks in primary schools and 3,983 in secondary schools in 13 regions, which implement the Safe School Programme. Happy and Sad (suggestion) boxes were established in their schools as part of the desks. This includes the allocation of special rooms for student/pupil guidance and counselling.\nIn Zanzibar, the government is in the process of developing a comprehensive safe school program. This has started with a review of available resources, including assessments of children's safety in schools, to guide program development. Zanzibar government is developing booklets with messages for faith leaders to guide them in delivering sermons that promote nonviolent parenting and positive disciplining of children.","lang":"en"}]},{"iso":"UGA","name":"Uganda","status":"On track","pledges":[{"status":"On track","note":"•\tRollout the Alternatives to Corporal Punishment guide to all schools in Uganda by 2025.\n•\tThe Alternatives to corporal punishment were revised and are going through the final approval processes of the Ministry of education and sports\n•\tOperationalize the School Health Policy by 2025.\n•\tThe school health policy was approved by the TMM of the MOES, and has been tabled before cabinet for approval.\n•\tRoll out the Life skills toolkit in all schools in Uganda by 2025.\n•\tThe toolkit is been rolled out to all the districts of West Nile, Karamoja and some districts of northern Uganda and Western Uganda.    Efforts are being made to retool all the master trainers from the colleges across the country to support the rollout in districts and regions where the ministry has not yet reached.\n•\tThe circular approving the scale-up of Life Skills interventions to stakeholders was officially signed off. Implementation of the life skills is ongoing in 34 districts across the country with support from UNICEF and Enable.  The MOES is in the process of developing a National Plan to guide the phased scale-up of the toolkit across additional districts.\n•\tRoll out the Good School Toolkit nationally by 2030.\n•\tThe adapted Good Schools Toolkit Agile version a lighter, more scalable iteration has been finalized which will facilitate broader reach. Building on a foundation of 1,500 schools, an additional 1,000 schools have been recruited, bringing the total number of schools using the Good School Toolkit to 2,500.\n•\tWith support of partners, a pool of 14 Regional Resource Persons (RRPs) have been trained to facilitate the roll out of the GST, this will join the existing 26 Master trainers to provide ongoing technical support and capacity strengthening to schools and stakeholders across the country bringing the total number of Regional Resource Persons to 30.\n•\tIn addition ongoing mentorship by RRPs, establishment of school peer learning groups, digital communication platforms for ongoing technical assistance, and collaboration with district education offices and local government officials for implementation, monitoring and policy support.\n•\tOperationalize the Gender in Education Strategy, 2015 VAC Strategy and National Strategy for Girls Education.\n•\tThe Gender and VAC strategy was finalized, validated.  Awaiting final approval by top management of the Ministry of Education.\n•\tA baseline on VAC under the Uganda Secondary Education Project (USEEP) was conducted in 81 districts targeting secondary and TVET institutions.  The report was approved for dissemination.\n•\tThe Gender for Development Program is being implemented in 29 districts across the country to address adolescent health issues including prevention of teenage pregnancy and other forms of GBV and sexual reproductive health.\n•\tBuilt Capacity of Civil Society organisations to support implementation of the strategy including the guidelines for RTRR and guidelines for prevention of teenage pregnancy (BRAC, Action Aid)","lang":"en"}]},{"iso":"UZB","name":"Uzbekistan","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"ZAF","name":"South Africa","status":"No data reported","pledges":[{"status":"No data reported","note":null,"lang":"en"}]},{"iso":"ZMB","name":"Zambia","status":"On track","pledges":[{"status":"On track","note":"Development and Implementation of the National Safe School Manual:\nThe Ministry of Education developed the National Safe School Manual to address protection concerns affecting both learners and education personnel. The Manual covers mental health, WASH, climate and disaster risk preparedness, school-related gender-based violence and other dimensions of school safety. Education officials at national, provincial and district levels, as well as headteachers and guidance teachers, have been oriented on the Safe Schools approach.\nMainstreaming Child Safeguarding in Schools:\nChild safeguarding is being actively mainstreamed across 450 primary schools and 225 secondary schools, strengthening institutional measures for preventing and responding to risks of violence, abuse and exploitation within the school environment.\nDevelopment of School-Level Child Safeguarding Guidelines:\nA further 251 schools developed child safeguarding guidelines, bringing the national total to 926 schools out of 13,487 schools nationwide, based on the 2025 Education Statistical Bulletin. This represents progress towards institutionalising safeguarding systems at school level.\nStrengthening Prevention and Response to School-Related Gender-Based Violence:\nIn 2025, 11,410 schools conducted lessons or training for learners on the prevention and response to school-related gender-based violence (SRGBV). In addition, 9,136 follow-up support interventions were undertaken, including counselling, disciplinary action, police/social welfare referrals and engagement with parents and guardians.\nStrengthening Child Participation through Learner Councils:\nA Learner Council Manual and related materials were developed, and education staff and learners in North-Western and Luapula Provinces were oriented on the operation of learner councils. This strengthens meaningful child participation and provides learners with mechanisms through which their concerns can be raised within the school environment.\nStrengthening Safe and Confidential Reporting Channels:\nExisting mechanisms for reporting violence against children have been strengthened through the implementation of the Child Online Protection Strategy and other child protection initiatives. In 2026, the Zambia Police Service, with support from the S, procured complaint boxes for installation in selected schools across all ten provinces, in collaboration with the Ministry of Education, to provide children with safe and confidential channels for reporting abuse.\nStrengthening Capacity of First Responders:\nThe Zambia Police Service has strengthened the capacity of officers responsible for child protection and school-related safeguarding. In July 2024, a national roll-out of Sexual and Gender-Based Violence (SGBV) and Child Protection training was undertaken for first responders, including criminal investigators, Victim Support Unit officers, Child Protection officers, Schools Liaison officers and Community Safety officers. A total of 900 officers were trained across nine provinces.\nCommunity and School-Based Awareness:\nIn 2025, the Zambia Police Service implemented a national public sensitisation campaign under the theme â€œReport Abuse, Protect Childhood.â€ The campaign covered all ten provinces and targeted communities and schools through community drama, brochures, radio discussions, road shows and focus group discussions.\nChild-Friendly Police and Reporting Services:\nThe Zambia Police Service has strengthened child-friendly approaches through the provision of furniture, toys and child-friendly spaces at One Stop Centres, while specialised Victim Support officers have been identified and deployed at front desks to strengthen child-friendly services from the initial point of contact.","lang":"en"}]},{"iso":"ZWE","name":"Zimbabwe","status":"On track","pledges":[{"status":"On track","note":"The Government of Zimbabwe has made significant advancements in education through various initiatives aimed at promoting inclusivity, safety, and quality learning. Recent amendments to the Education Act ensure access for all children, including provisions for pregnant girls, in line with the Safe Schools Declaration. A Code of Conduct for teachers and guidelines on classroom capacity have been established, alongside a draft Inclusive Education Policy and a school health strategy to support student well-being.\nThe government has embraced eLearning platforms, introducing the Ministry of Primary and Secondary Education (MoPSE) chatbot for enhanced communication. Training in computer science has been prioritized across districts, in partnership with local universities. A new curriculum has been implemented, with schools constructed to include accessibility features.\nClinical remediation efforts have supported numerous children, while a Positive Discipline manual is being drafted. Guidance and counseling sessions have reached many students, incorporating age-appropriate topics. The mainstreaming of issues like Domestic and Sexual Abuse (DASA) and School-Related Gender-Based Violence (SGBV) is underway, supported by awareness campaigns.\nAdditionally, life skills training has begun at the ECD level, addressing period poverty and reclaiming the dignity of the girl child. The home-grown school feeding program has increased enrollment and reduced absenteeism, reinforcing the government's commitment to quality education.","lang":"en"}]}]};
</script>

<script>
window.CGD_INTERACTIVE_NAME = 'pledges-2026-safe-schools-map';
(() => {
  const PARENT_ORIGIN = 'https://www.cgdev.org';
  const NAME = window.CGD_INTERACTIVE_NAME;
  const VALID = new Set(['filter','preset','detail_open','detail_close','view_control','navigate','compare','external_link','download']);
  let viewTracked = false;
  function send(event, params) { if (window.parent) window.parent.postMessage(Object.assign({ type: 'cgd_analytics', event }, params), PARENT_ORIGIN); }
  window.CGDTracking = {
    trackView() { if (viewTracked) return; viewTracked = true; send('interactive_view', { interactive_name: NAME }); },
    trackEngagement(type, label, value) {
      if (!VALID.has(type)) return;
      const p = { interactive_name: NAME, action_type: type, action_label: label };
      if (value !== undefined && value !== null && value !== '') p.action_value = String(value);
      send('interactive_engagement', p);
    }
  };
})();
</script>

<script>
(() => {
  const SVGNS = 'http://www.w3.org/2000/svg';
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const countPhrase = (n, s, p) => `${n} ${n === 1 ? s : p}`;
  const byIso = new Map(DATA.details.map(d => [d.iso, d]));

  /* Summary, source (with link), notes */
  document.getElementById('chartSummary').textContent = DATA.summary;
  const src = document.getElementById('source');
  const link = el('a', null, DATA.source.linkText);
  link.href = DATA.source.url; link.target = '_blank'; link.rel = 'noopener';
  link.addEventListener('click', () => CGDTracking.trackEngagement('external_link', 'source', DATA.source.url));
  src.append(DATA.source.before, link, DATA.source.after);
  document.getElementById('notes').textContent = DATA.notes;

  /* Legend (counts from the data present) */
  const legend = document.getElementById('legend');
  const counts = {};
  DATA.details.forEach(d => { counts[d.status] = (counts[d.status] || 0) + 1; });
  DATA.statusOrder.forEach(s => {
    const li = el('li');
    const sw = el('span', 'swatch'); sw.style.background = DATA.colors[s];
    li.append(sw, el('span', null, `${s} (${counts[s] || 0})`));
    legend.append(li);
  });

  /* Map */
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${DATA.width} ${DATA.height}`);
  svg.setAttribute('aria-hidden', 'true');
  const gCountries = document.createElementNS(SVGNS, 'g');
  const gMarkers = document.createElementNS(SVGNS, 'g');
  const highlight = document.createElementNS(SVGNS, 'path');
  highlight.setAttribute('class', 'highlight');
  const nodes = new Map();

  DATA.features.forEach(f => {
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', f.d);
    const d = byIso.get(f.iso);
    p.setAttribute('class', 'country' + (d ? ' country--data' : ''));
    p.setAttribute('fill', d ? DATA.colors[d.status] : DATA.noPledgeColor);
    p.dataset.iso = f.iso;
    if (d) {
      p.setAttribute('tabindex', '0');
      p.setAttribute('role', 'button');
      p.setAttribute('aria-label', `${d.name}: ${d.status}`);
      p.dataset.tooltipOwner = '';
      nodes.set(f.iso, p);
    }
    attachTooltip(p, () => content(f.iso, f.name));
    gCountries.append(p);
  });
  DATA.markers.forEach(m => {
    const d = byIso.get(m.iso);
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', m.x); c.setAttribute('cy', m.y); c.setAttribute('r', 5);
    c.setAttribute('class', 'marker');
    c.setAttribute('fill', d ? DATA.colors[d.status] : DATA.noPledgeColor);
    c.setAttribute('tabindex', '0'); c.setAttribute('role', 'button');
    c.setAttribute('aria-label', `${m.name}: ${d ? d.status : DATA.noPledgeLabel}`);
    c.dataset.tooltipOwner = ''; c.dataset.iso = m.iso;
    nodes.set(m.iso, c);
    attachTooltip(c, () => content(m.iso, m.name));
    gMarkers.append(c);
  });
  svg.append(gCountries, highlight, gMarkers);
  const map = document.getElementById('map');
  map.append(svg);

  function content(iso, fallbackName) {
    const d = byIso.get(iso);
    const box = el('div');
    box.append(el('p', 'tooltip__title', d ? d.name : fallbackName));
    if (!d) { box.append(el('p', 'tooltip__status', DATA.noPledgeLabel)); return box; }
    box.append(el('p', 'tooltip__status', d.status));
    const body = el('div', 'tooltip__body');
    d.pledges.forEach((p, i) => {
      const item = el('div', 'tooltip__pledge');
      if (d.pledges.length > 1) item.append(el('p', 'tooltip__label', `Pledge ${i + 1}: ${p.status}`));
      item.append(el('p', 'tooltip__text', p.note || 'No progress notes submitted.'));
      if (p.note && p.lang === 'original') item.append(el('p', 'tooltip__lang', 'No English translation available; shown as submitted.'));
      body.append(item);
    });
    box.append(body, el('p', 'tooltip__hint', 'Click the country to keep this box in place; click again or press Esc to release.'));
    return box;
  }

  /* Tooltip (CGD standard 10.9) */
  const tooltip = document.getElementById('tooltip');
  let owner = null, pinned = false, closeTimer = 0;
  function place(x, y, off = 16) {
    const pad = 12, b = tooltip.getBoundingClientRect();
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    let left = x + off, top = y + off;
    if (left + b.width > vw - pad) left = x - b.width - off;
    if (top + b.height > vh - pad) top = y - b.height - off;
    tooltip.style.left = Math.max(pad, Math.min(left, vw - b.width - pad)) + 'px';
    tooltip.style.top = Math.max(pad, Math.min(top, vh - b.height - pad)) + 'px';
  }
  function centre(n) { const b = n.getBoundingClientRect(); return { x: b.left + b.width / 2, y: b.top + b.height / 2 }; }
  function show(n, node, pt = centre(n)) {
    clearTimeout(closeTimer);
    owner?.removeAttribute('aria-describedby');
    owner = n; n.setAttribute('aria-describedby', 'tooltip');
    tooltip.replaceChildren(node); tooltip.hidden = false; place(pt.x, pt.y);
  }
  function scheduleClose() {
    clearTimeout(closeTimer);
    closeTimer = setTimeout(() => { if (pinned) return; tooltip.hidden = true; owner?.removeAttribute('aria-describedby'); owner = null; }, 120);
  }
  function attachTooltip(n, factory) {
    n.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch' && !pinned) show(n, factory(), { x: e.clientX, y: e.clientY }); });
    n.addEventListener('pointermove', e => { if (!tooltip.hidden && !pinned && owner === n && e.pointerType !== 'touch') place(e.clientX, e.clientY); });
    n.addEventListener('pointerleave', scheduleClose);
    n.addEventListener('focus', () => { if (!pinned) show(n, factory()); });
    n.addEventListener('blur', scheduleClose);
    n.addEventListener('pointerup', e => {
      /* Click or tap pins the tooltip in place; click the same country again, click elsewhere or press Escape to release */
      if (pinned && owner === n) { unpin(); return; }
      pinned = true; show(n, factory(), { x: e.clientX, y: e.clientY }); markPinned(n);
      CGDTracking.trackEngagement('detail_open', 'country_tooltip', n.getAttribute('aria-label'));
    });
  }
  function markPinned(n) {
    const f = DATA.features.find(x => x.iso === n.dataset.iso);
    if (f) highlight.setAttribute('d', f.d); else highlight.removeAttribute('d');
  }
  function unpin() {
    pinned = false; highlight.removeAttribute('d');
    tooltip.hidden = true; owner?.removeAttribute('aria-describedby'); owner = null;
  }
  tooltip.addEventListener('pointerenter', () => clearTimeout(closeTimer));
  tooltip.addEventListener('pointerleave', scheduleClose);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') unpin(); });
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-tooltip-owner]') || e.target.closest('#tooltip')) return;
    if (pinned || !tooltip.hidden) unpin();
  });

  window.addEventListener('load', () => CGDTracking.trackView());
})();
</script>

<script>
(function () {
  var PARENT_ORIGIN = 'https://www.cgdev.org';
  var lastHeight = -1;
  function measure() { return Math.ceil(document.body.getBoundingClientRect().height); }
  function report() {
    var height = measure();
    if (height <= 0 || height === lastHeight) return;
    lastHeight = height;
    window.parent.postMessage({ type: 'cgd-iframe-resize', height: height }, PARENT_ORIGIN);
  }
  window.addEventListener('load', report);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
  else window.addEventListener('resize', report);
})();
</script>
